name: JARVIS Windows local agent
on:
  push:
    paths:
      - 'apps/windows/**'
      - '.github/workflows/windows-agent.yml'
  pull_request:
    paths:
      - 'apps/windows/**'
      - '.github/workflows/windows-agent.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-agent:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned Windows integrations
        run: python -m pip install -r requirements-windows.txt
      - name: Verify upstream runtime imports
        run: python -c "from pywinauto import Desktop; from vosk import Model; import sounddevice; import pyttsx3; print('upstreams-imported')"
      - name: Offline unit and safety regression tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke (no microphone or desktop needed)
        run: python -m jarvis_windows --command "Jarvis dime la hora"
