name: Android 14 instrumentation
on:
  pull_request:
    paths:
      - "apps/android/**"
      - "tools/prepare_kws_model.py"
      - "tools/prepare_kws_model.py"
      - ".github/workflows/android-instrumentation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  android14:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configure JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "8.13"
      - name: Prepare Android SDK 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install target platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build-only BPE tokenizer
        run: python3 -m pip install --disable-pip-version-check --no-deps sentencepiece==0.2.1
      - name: Android 14 emulator tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          working-directory: apps/android
          script: gradle --no-daemon :app:connectedDebugAndroidTest
