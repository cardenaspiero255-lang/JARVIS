name: KWS model diagnostics
on:
  pull_request:
    paths:
      - "tools/compare_kws_upstream.py"
      - ".github/workflows/kws-model-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install offline ONNX diagnostic (pin exact upstream ABI)
        run: python -m pip install --disable-pip-version-check "numpy<2" onnx==1.17.0 sentencepiece==0.2.1 sherpa-onnx==1.13.8
      - name: Compare upstream full and mobile KWS
        run: python -u tools/compare_kws_upstream.py
