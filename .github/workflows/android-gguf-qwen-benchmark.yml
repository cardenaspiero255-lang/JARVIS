name: Android Qwen 0.5B real benchmark

on:
  pull_request:
    paths:
      - "apps/android/app/src/main/java/com/cardenaspiero255/jarvis/core/OfflineVoice*"
      - "apps/android/app/src/main/java/com/cardenaspiero255/jarvis/NativeSpanishSpeechRunner.kt"
      - "apps/android/app/src/main/java/com/cardenaspiero255/jarvis/HandsFreePreviewService.kt"
      - "apps/android/app/src/main/java/com/cardenaspiero255/jarvis/LocalGgufInference.kt"
      - "apps/android/app/src/ggufQwenE2e/**"
      - "apps/android/app/build.gradle.kts"
      - "apps/android/run_android14_qwen_benchmark.sh"
      - "tools/prepare_gguf_qwen_benchmark.py"
      - ".github/workflows/android-gguf-qwen-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-qwen-cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Checkout no retained credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "8.13"
      - name: Android SDK 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Pinned SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build only tokenizer
        run: python3 -m pip install --disable-pip-version-check --no-deps sentencepiece==0.2.1
      - name: Obtain official Qwen GGUF only for instrumentation
        run: |
          python3 tools/prepare_gguf_qwen_benchmark.py \
            --dest apps/android/app/build/generated/ggufQwenE2eAssets/instruct-qwen.gguf
      - name: Enable KVM emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Genuine offline Qwen CPU latency and PSS Android14
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          working-directory: apps/android
          script: bash run_android14_qwen_benchmark.sh
      - name: Preserve structured benchmark only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: jarvis-real-qwen-emulator-benchmark
          path: |
            apps/android/app/build/diagnostics/qwen-quality/
            apps/android/app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: warn
