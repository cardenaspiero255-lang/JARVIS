name: Android GGUF real generation E2E

on:
  pull_request:
    paths:
      - "apps/android/app/src/main/java/com/cardenaspiero255/jarvis/LocalGguf*"
      - "apps/android/app/src/main/java/com/cardenaspiero255/jarvis/core/LocalGguf*"
      - "apps/android/app/src/main/cpp/**"
      - "apps/android/app/src/ggufE2e/**"
      - "apps/android/app/src/androidTest/java/com/cardenaspiero255/jarvis/LocalGguf*"
      - "apps/android/app/build.gradle.kts"
      - "tools/prepare_llama_cpp.py"
      - "tools/prepare_gguf_e2e_fixture.py"
      - "tools/gguf_qa_report.py"
      - "tests/test_gguf_qa_report.py"
      - "tests/test_gguf_voice_benchmark_contract.py"
      - "apps/android/run_android14_gguf_e2e.sh"
      - ".github/workflows/android-gguf-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  genuine-gguf:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "8.13"
      - name: Android SDK 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install SDK and pinned NDK for native backend
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build-only BPE tokenizer
        run: python3 -m pip install --disable-pip-version-check --no-deps sentencepiece==0.2.1
      - name: Acquire and hash-check official Apache-2.0 GGUF on CI HOST
        run: |
          python3 tools/prepare_gguf_e2e_fixture.py \
            --dest apps/android/app/build/generated/ggufE2eAssets/e2e-smollm.gguf
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android14 model generation (no phone Internet)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 3072M
          working-directory: apps/android
          script: bash run_android14_gguf_e2e.sh
      - name: Upload only test reports (NEVER models or APK with model)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: jarvis-real-gguf-e2e-evidence
          path: |
            apps/android/app/build/diagnostics/gguf-e2e/
            apps/android/app/build/outputs/androidTest-results/
            apps/android/app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 7
