name: Contract tests
on: [push, pull_request]
permissions:
  contents: read

concurrency:
  # Ref is unique for PRs and branches; main runs retain independent evidence.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  sentinel_wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cardenaspiero255-lang/Ultra-Sentinel
          ref: dde29a1b80c283d441ce220ce1190b3175956aac
          path: .external/ultra-sentinel
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/crossrepo-contract.test.cjs
